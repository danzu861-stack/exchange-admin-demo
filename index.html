<!DOCTYPE html>

<html lang="vi">

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>EXCHANGE PRO ADMIN</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#0b1120;color:white;font-family:Arial}

header{padding:22px;background:#172338;color:#60a5fa;font-size:23px;font-weight:bold}

main{padding:18px;max-width:850px;margin:auto}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.card{background:#172338;padding:20px;border-radius:12px}

.number{font-size:25px;font-weight:bold;color:#60a5fa;margin-top:12px}

button{padding:12px;background:#2563eb;color:white;border:0;border-radius:8px}

.panel{background:#172338;padding:16px;border-radius:12px;margin-top:12px;overflow:auto}

table{width:100%;text-align:left;border-collapse:collapse}

small{color:#94a3b8}

.green{color:#4ade80}
